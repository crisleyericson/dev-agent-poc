name: Dev Agent REVIEW POC

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number

concurrency:
  group: dev-agent-review-global
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pr_number }}

      OPENCODE_CONFIG_CONTENT: >-
        {
          "$schema": "https://opencode.ai/config.json",
          "autoupdate": false,
          "provider": {
            "omniroute": {
              "npm": "@ai-sdk/openai-compatible",
              "name": "OmniRoute",
              "options": {
                "baseURL": "https://omniroute-cvr6.srv1921690.hstgr.cloud/v1",
                "apiKey": "{env:OMNIROUTE_API_KEY}"
              },
              "models": {
                "review-combo": {
                  "name": "Review Combo"
                },
                "deep-combo": {
                  "name": "Deep Combo"
                }
              }
            }
          },
          "permission": {
            "*": "deny"
          }
        }

    steps:
      - name: Checkout workflow tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Prepare OpenCode agent runner
        run: |
          cp .github/scripts/run-opencode-agent.sh /tmp/run-opencode-agent.sh
          chmod +x /tmp/run-opencode-agent.sh

      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 1

      - name: Install OpenCode
        run: |
          npm install --global opencode-ai@1.18.23
          opencode --version

      - name: Load PR and Issue context
        run: |
          gh pr view "$PR_NUMBER" \
            --json title,body,baseRefName,headRefName \
            --jq '"Title: \(.title)\nBase: \(.baseRefName)\nHead: \(.headRefName)\n\nBody:\n\(.body)"' \
            > /tmp/pr.txt

          gh pr diff "$PR_NUMBER" > /tmp/pr.diff

          ISSUE_NUMBER="$(
            gh pr view "$PR_NUMBER" --json body --jq '.body' |
              sed -nE 's/.*Source issue: #([0-9]+).*/\1/p' |
              head -n 1
          )"

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "ERROR: Could not determine source issue."
            exit 1
          fi

          gh issue view "$ISSUE_NUMBER" \
            --json title,body \
            --jq '"Title: \(.title)\n\n\(.body)"' \
            > /tmp/issue.txt

          echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> "$GITHUB_ENV"

      - name: Prepare REVIEW prompt
        run: |
          {
            echo '# REVIEW'
            echo
            echo 'Review the implementation in this pull request independently.'
            echo
            echo '## Source Issue'
            echo
            cat /tmp/issue.txt
            echo
            echo '## Pull Request'
            echo
            cat /tmp/pr.txt
            echo
            echo '## Diff'
            echo
            cat /tmp/pr.diff
            echo
            echo '## Review rules'
            echo
            echo '- Verify every acceptance criterion.'
            echo '- Check correctness, regressions, and test adequacy.'
            echo '- Use only the Source Issue, Pull Request metadata, and Diff provided in this prompt.'
            echo '- Do not inspect repository files or use tools.'
            echo '- Do not modify any file.'
            echo '- Do not run shell commands.'
            echo '- Do not use git.'
            echo '- Do not create commits or push.'
            echo '- APPROVED only when there is no material issue.'
            echo '- CHANGES_REQUESTED when an actionable defect must be fixed.'
            echo '- BLOCKED only when there is insufficient evidence to review.'
            echo
            echo 'Your final response MUST start with exactly one of:'
            echo 'REVIEW_STATUS: APPROVED'
            echo 'REVIEW_STATUS: CHANGES_REQUESTED'
            echo 'REVIEW_STATUS: BLOCKED'
            echo
            echo 'Then provide a concise review summary and findings.'
          } > /tmp/review-prompt.txt

      - name: Run REVIEW agent
        id: review_agent
        continue-on-error: true
        shell: bash
        run: |
          /tmp/run-opencode-agent.sh \
            --stage REVIEW \
            --prompt /tmp/review-prompt.txt \
            --output /tmp/opencode-review.jsonl \
            --model omniroute/review-combo \
            --fallback-model omniroute/deep-combo \
            --timeout 180 \
            --attempts 3

      - name: Handle REVIEW agent failure
        if: steps.review_agent.outcome == 'failure'
        run: |
          echo "REVIEW_STATUS=AGENT_FAILED" >> "$GITHUB_ENV"
          echo "REVIEW_FAILURE_REASON=OpenCode REVIEW failed after configured retries" >> "$GITHUB_ENV"

      - name: Parse REVIEW result
        if: steps.review_agent.outcome == 'success'
        run: |
          jq -r '
            select(.type == "text" and .part.type == "text")
            | .part.text
          ' /tmp/opencode-review.jsonl > /tmp/review.txt

          echo "Reviewer output:"
          cat /tmp/review.txt

          REVIEW_STATUS="$(
            grep -E '^REVIEW_STATUS: (APPROVED|CHANGES_REQUESTED|BLOCKED)$' \
              /tmp/review.txt |
              tail -n 1 |
              sed 's/^REVIEW_STATUS: //'
          )"

          case "$REVIEW_STATUS" in
            APPROVED|CHANGES_REQUESTED|BLOCKED)
              ;;
            *)
              echo "ERROR: Invalid or missing REVIEW_STATUS."
              exit 1
              ;;
          esac

          echo "REVIEW_STATUS=$REVIEW_STATUS" >> "$GITHUB_ENV"
          echo "Parsed REVIEW_STATUS=$REVIEW_STATUS"

      - name: Persist REVIEW on PR
        if: steps.review_agent.outcome == 'success'
        run: |
          {
            echo '## Agent REVIEW'
            echo
            echo "**Status: ${REVIEW_STATUS}**"
            echo
            cat /tmp/review.txt
            echo
            echo '---'
            echo "Source issue: #${ISSUE_NUMBER}"
            echo "Review run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/review-comment.md

          gh pr comment "$PR_NUMBER" --body-file /tmp/review-comment.md

          echo "### REVIEW result" >> "$GITHUB_STEP_SUMMARY"
          echo "PR: #${PR_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: ${REVIEW_STATUS}" >> "$GITHUB_STEP_SUMMARY"

      - name: Persist pipeline status
        shell: bash
        run: |
          case "$REVIEW_STATUS" in
            APPROVED)
              PIPELINE_STATUS="APPROVED"
              ;;
            CHANGES_REQUESTED)
              PIPELINE_STATUS="RUNNING"
              ;;
            BLOCKED|AGENT_FAILED)
              PIPELINE_STATUS="NEEDS_HUMAN"
              ;;
            *)
              echo "ERROR: Unsupported REVIEW_STATUS: $REVIEW_STATUS"
              exit 1
              ;;
          esac

          UPDATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          REVIEW_RUN="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo '<!-- dev-agent-pipeline-status -->'
            echo
            echo '## Dev Agent Pipeline'
            echo
            echo "**PIPELINE_STATUS: ${PIPELINE_STATUS}**"
            echo
            echo "SOURCE_ISSUE: #${ISSUE_NUMBER}"
            echo "BUILD_RUN: not tracked yet"
            echo "REVIEW_RUN: ${REVIEW_RUN}"
            echo "FIX_RUNS: not tracked yet"
            echo "PR: #${PR_NUMBER}"
            echo
            echo "LAST_STAGE: REVIEW"
            echo "LAST_REVIEW_STATUS: ${REVIEW_STATUS}"

            if [ "$REVIEW_STATUS" = "AGENT_FAILED" ]; then
              echo "REASON: ${REVIEW_FAILURE_REASON}"
            fi

            echo "UPDATED_AT: ${UPDATED_AT}"
          } > /tmp/pipeline-status.md

          COMMENT_ID="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq '.[] |
                select(.body | contains("<!-- dev-agent-pipeline-status -->")) |
                .id' |
              head -n 1
          )"

          jq -n \
            --rawfile body /tmp/pipeline-status.md \
            '{body: $body}' \
            > /tmp/pipeline-status.json

          if [ -n "$COMMENT_ID" ]; then
            echo "Updating pipeline status comment $COMMENT_ID"

            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              --input /tmp/pipeline-status.json
          else
            echo "Creating pipeline status comment"

            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --input /tmp/pipeline-status.json
          fi

          echo "Pipeline status: ${PIPELINE_STATUS}" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger FIX
        if: env.REVIEW_STATUS == 'CHANGES_REQUESTED'
        run: |
          echo "Triggering FIX for PR #${PR_NUMBER}"

          gh workflow run dev-agent-fix.yml \
            -f pr_number="${PR_NUMBER}"

      - name: Fail workflow after REVIEW agent failure
        if: steps.review_agent.outcome == 'failure'
        run: |
          echo "REVIEW failed after configured retries."
          exit 1
