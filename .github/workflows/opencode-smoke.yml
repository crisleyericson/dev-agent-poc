name: OpenCode OmniRoute Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    env:
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}

      OPENCODE_CONFIG_CONTENT: >-
        {
          "$schema": "https://opencode.ai/config.json",
          "autoupdate": false,
          "provider": {
            "omniroute": {
              "npm": "@ai-sdk/openai-compatible",
              "name": "OmniRoute",
              "options": {
                "baseURL": "https://omniroute-cvr6.srv1921690.hstgr.cloud/v1",
                "apiKey": "{env:OMNIROUTE_API_KEY}"
              },
              "models": {
                "review-combo": {
                  "name": "Review Combo"
                },
                "deep-combo": {
                  "name": "Deep Combo"
                }
              }
            }
          },
          "permission": {
            "*": "deny"
          }
        }

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install OpenCode
        run: |
          npm install --global opencode-ai@1.18.23
          opencode --version

      - name: Test REVIEW combo
        run: |
          timeout 60 \
            opencode run \
              --model omniroute/review-combo \
              --format json \
              "Do not use tools. Respond exactly with: REVIEW_OK" \
            | tee review-smoke.jsonl

      - name: Assert REVIEW response
        run: |
          grep -q 'REVIEW_OK' review-smoke.jsonl

      - name: Test DEEP combo
        run: |
          timeout 60 \
            opencode run \
              --model omniroute/deep-combo \
              --format json \
              "Do not use tools. Respond exactly with: DEEP_OK" \
            | tee deep-smoke.jsonl

      - name: Assert DEEP response
        run: |
          grep -q 'DEEP_OK' deep-smoke.jsonl
