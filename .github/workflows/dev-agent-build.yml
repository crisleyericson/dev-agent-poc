name: Dev Agent BUILD POC

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: dev-agent-build-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.label.name == 'agent-build-v3'

    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      GH_TOKEN: ${{ github.token }}

      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}

      OPENCODE_CONFIG_CONTENT: >-
        {
          "$schema": "https://opencode.ai/config.json",
          "autoupdate": false,
          "provider": {
            "omniroute": {
              "npm": "@ai-sdk/openai-compatible",
              "name": "OmniRoute",
              "options": {
                "baseURL": "https://omniroute-cvr6.srv1921690.hstgr.cloud/v1",
                "apiKey": "{env:OMNIROUTE_API_KEY}"
              },
              "models": {
                "build-combo": {
                  "name": "Build Combo"
                }
              }
            }
          },
          "permission": {
            "*": "deny",
            "read": "allow",
            "glob": "allow",
            "grep": "allow",
            "edit": {
              "*": "deny",
              "src/**": "allow",
              "test/**": "allow"
            }
          }
        }

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install OpenCode
        run: |
          npm install --global opencode-ai@1.18.23
          opencode --version

      - name: Prepare BUILD prompt
        run: |
          {
            echo '# BUILD'
            echo
            echo 'Implement the GitHub Issue below.'
            echo
            echo '## Issue'
            echo
            echo "Number: #${ISSUE_NUMBER}"
            echo "Title: ${ISSUE_TITLE}"
            echo
            printf '%s\n' "${ISSUE_BODY}"
            echo
            echo '## Rules'
            echo
            echo '- Inspect only files necessary for this task.'
            echo '- Make the minimum implementation required.'
            echo '- Modify only files under src/** and test/**.'
            echo '- Do not modify workflows, configuration, documentation, or unrelated files.'
            echo '- Do not run shell commands.'
            echo '- Do not use git.'
            echo '- Do not create branches.'
            echo '- Do not commit.'
            echo '- Do not push.'
            echo '- Do not create a pull request.'
            echo '- Git operations and validation are handled externally after you finish.'
          } > /tmp/build-prompt.txt

      - name: Run BUILD agent
        id: build_agent
        shell: bash
        run: |
          .github/scripts/run-opencode-agent.sh \
            --stage BUILD \
            --prompt /tmp/build-prompt.txt \
            --output /tmp/opencode-build.jsonl \
            --model omniroute/build-combo \
            --timeout 600 \
            --attempts 3

      - name: Validate changed files
        id: validate_changed_files
        shell: bash
        run: |
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/all-changed-files.txt

          echo "All workspace changes:"
          cat /tmp/all-changed-files.txt

          # Runtime output from the BUILD runner is diagnostic data, not an
          # implementation change. Ignore only this known artifact; every
          # other path remains subject to the src/** + test/** guardrail.
          IGNORED_FILES="$(
            grep -E '^opencode-build\.jsonl$' /tmp/all-changed-files.txt || true
          )"

          grep -Ev '^opencode-build\.jsonl$' \
            /tmp/all-changed-files.txt > /tmp/changed-files.txt || true

          if [ -n "$IGNORED_FILES" ]; then
            echo "Ignored BUILD runtime artifacts:"
            printf '%s\n' "$IGNORED_FILES"
          fi

          echo "Implementation changes considered by guardrail:"
          cat /tmp/changed-files.txt

          if [ ! -s /tmp/changed-files.txt ]; then
            echo "ERROR: OpenCode produced no implementation file changes."
            exit 1
          fi

          INVALID_FILES="$(
            grep -Ev '^(src/|test/)' /tmp/changed-files.txt || true
          )"

          if [ -n "$INVALID_FILES" ]; then
            echo "ERROR: OpenCode modified forbidden files:"
            printf '%s\n' "$INVALID_FILES"

            {
              echo '### Changed-file validation failed'
              echo
              echo 'Disallowed files:'
              echo '```text'
              printf '%s\n' "$INVALID_FILES"
              echo '```'
              echo
              echo 'Allowed implementation paths: `src/**` and `test/**`.'
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

          echo "Changed-file validation passed."

          {
            echo '### Changed-file validation'
            echo
            echo 'Allowed-file guardrail passed.'
            if [ -n "$IGNORED_FILES" ]; then
              echo
              echo 'Ignored runner artifact:'
              echo '```text'
              printf '%s\n' "$IGNORED_FILES"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        id: run_tests
        run: |
          npm test

      - name: Validate diff
        id: validate_diff
        run: |
          git diff --check
          git diff

      - name: Create branch and commit
        id: create_branch_and_commit
        env:
          BRANCH_NAME: agent-v3/issue-${{ github.event.issue.number }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git config user.name "dev-agent-bot"
          git config user.email "dev-agent-bot@users.noreply.github.com"

          git switch -c "$BRANCH_NAME"

          git add --all -- src test
          git commit -m "feat: implement issue #${ISSUE_NUMBER}"

          git push origin "$BRANCH_NAME"

          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: Prepare PR body
        run: |
          {
            echo "Automated BUILD for #${ISSUE_NUMBER}."
            echo
            echo "Source issue: #${ISSUE_NUMBER}"
            echo
            echo 'Validation:'
            echo '- OpenCode BUILD completed'
            echo '- allowed-files validation passed'
            echo '- npm test passed'
            echo '- git diff --check passed'
            echo
            echo 'Merge remains manual.'
          } > /tmp/pr-body.md

      - name: Create pull request
        id: create_pull_request
        run: |
          PR_URL="$(
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH_NAME" \
              --title "[agent-v3] ${ISSUE_TITLE}" \
              --body-file /tmp/pr-body.md
          )"

          PR_NUMBER="${PR_URL##*/}"

          echo "Created PR: $PR_URL"
          echo "PR number: $PR_NUMBER"

          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

          echo "### BUILD result" >> "$GITHUB_STEP_SUMMARY"
          echo "$PR_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Persist BUILD failure pipeline status
        if: failure() && env.PR_NUMBER == ''
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BUILD_RUN="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          UPDATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          REASON="BUILD failed before PR creation"
          if [ "${{ steps.build_agent.outcome }}" = "failure" ]; then
            REASON="OpenCode BUILD failed after configured retries"
          elif [ "${{ steps.validate_changed_files.outcome }}" = "failure" ]; then
            REASON="BUILD changed-file validation failed"
          elif [ "${{ steps.run_tests.outcome }}" = "failure" ]; then
            REASON="BUILD tests failed"
          elif [ "${{ steps.validate_diff.outcome }}" = "failure" ]; then
            REASON="BUILD diff validation failed"
          elif [ "${{ steps.create_branch_and_commit.outcome }}" = "failure" ]; then
            REASON="BUILD commit or push failed"
          elif [ "${{ steps.create_pull_request.outcome }}" = "failure" ]; then
            REASON="BUILD pull request creation failed"
          fi

          {
            echo '<!-- dev-agent-pipeline-status -->'
            echo
            echo '## Dev Agent Pipeline'
            echo
            echo '**PIPELINE_STATUS: FAILED**'
            echo
            echo "SOURCE_ISSUE: #${ISSUE_NUMBER}"
            echo "BUILD_RUN: ${BUILD_RUN}"
            echo "REVIEW_RUN: none"
            echo "FIX_RUNS: none"
            echo "PR: none"
            echo
            echo "LAST_STAGE: BUILD"
            echo "REASON: ${REASON}"
            echo "UPDATED_AT: ${UPDATED_AT}"
          } > /tmp/pipeline-status.md

          COMMENT_ID="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              --jq '.[] |
                select(.body | contains("<!-- dev-agent-pipeline-status -->")) |
                .id' |
              head -n 1
          )"

          jq -n --rawfile body /tmp/pipeline-status.md \
            '{body: $body}' > /tmp/pipeline-status.json

          if [ -n "$COMMENT_ID" ]; then
            echo "Updating pipeline status comment on issue #${ISSUE_NUMBER}"
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              --input /tmp/pipeline-status.json
          else
            echo "Creating pipeline status comment on issue #${ISSUE_NUMBER}"
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              --input /tmp/pipeline-status.json
          fi

          echo "Pipeline status: FAILED" >> "$GITHUB_STEP_SUMMARY"
          echo "Build run: ${BUILD_RUN}" >> "$GITHUB_STEP_SUMMARY"
          echo "Reason: ${REASON}" >> "$GITHUB_STEP_SUMMARY"

      - name: Persist BUILD pipeline status
        shell: bash
        run: |
          BUILD_RUN="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          UPDATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          {
            echo '<!-- dev-agent-pipeline-status -->'
            echo
            echo '## Dev Agent Pipeline'
            echo
            echo '**PIPELINE_STATUS: RUNNING**'
            echo
            echo "SOURCE_ISSUE: #${ISSUE_NUMBER}"
            echo "BUILD_RUN: ${BUILD_RUN}"
            echo "REVIEW_RUN: pending"
            echo "FIX_RUNS: none"
            echo "PR: #${PR_NUMBER}"
            echo
            echo "LAST_STAGE: BUILD"
            echo "UPDATED_AT: ${UPDATED_AT}"
          } > /tmp/pipeline-status.md

          COMMENT_ID="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq '.[] |
                select(.body | contains("<!-- dev-agent-pipeline-status -->")) |
                .id' |
              head -n 1
          )"

          jq -n \
            --rawfile body /tmp/pipeline-status.md \
            '{body: $body}' \
            > /tmp/pipeline-status.json

          if [ -n "$COMMENT_ID" ]; then
            echo "Updating pipeline status comment $COMMENT_ID"

            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              --input /tmp/pipeline-status.json
          else
            echo "Creating pipeline status comment"

            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --input /tmp/pipeline-status.json
          fi

          echo "Pipeline status: RUNNING" >> "$GITHUB_STEP_SUMMARY"
          echo "Build run: ${BUILD_RUN}" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger REVIEW
        run: |
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::error::PR_NUMBER não definido"
            exit 1
          fi

          echo "Triggering REVIEW for PR #${PR_NUMBER}"

          gh workflow run dev-agent-review.yml \
            -f pr_number="${PR_NUMBER}"
