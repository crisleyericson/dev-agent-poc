name: Dev Agent BUILD POC

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: dev-agent-build-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.label.name == 'agent-build-v3'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      GH_TOKEN: ${{ github.token }}

      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}

      OPENCODE_CONFIG_CONTENT: >-
        {
          "$schema": "https://opencode.ai/config.json",
          "autoupdate": false,
          "provider": {
            "omniroute": {
              "npm": "@ai-sdk/openai-compatible",
              "name": "OmniRoute",
              "options": {
                "baseURL": "https://omniroute-cvr6.srv1921690.hstgr.cloud/v1",
                "apiKey": "{env:OMNIROUTE_API_KEY}"
              },
              "models": {
                "build-combo": {
                  "name": "Build Combo"
                }
              }
            }
          },
          "permission": {
            "*": "deny",
            "read": "allow",
            "glob": "allow",
            "grep": "allow",
            "edit": {
              "*": "deny",
              "src/**": "allow",
              "test/**": "allow"
            }
          }
        }

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install OpenCode
        run: |
          npm install --global opencode-ai@1.18.23
          opencode --version

      - name: Prepare BUILD prompt
        run: |
          {
            echo '# BUILD'
            echo
            echo 'Implement the GitHub Issue below.'
            echo
            echo '## Issue'
            echo
            echo "Number: #${ISSUE_NUMBER}"
            echo "Title: ${ISSUE_TITLE}"
            echo
            printf '%s\n' "${ISSUE_BODY}"
            echo
            echo '## Rules'
            echo
            echo '- Inspect only files necessary for this task.'
            echo '- Make the minimum implementation required.'
            echo '- Modify only files under src/** and test/**.'
            echo '- Do not modify workflows, configuration, documentation, or unrelated files.'
            echo '- Do not run shell commands.'
            echo '- Do not use git.'
            echo '- Do not create branches.'
            echo '- Do not commit.'
            echo '- Do not push.'
            echo '- Do not create a pull request.'
            echo '- Git operations and validation are handled externally after you finish.'
          } > /tmp/build-prompt.txt

      - name: Run BUILD agent
        shell: bash
        run: |
          set -o pipefail

          MAX_ATTEMPTS=3

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "=== BUILD attempt $ATTEMPT/$MAX_ATTEMPTS ==="

            set +e

            timeout --signal=TERM --kill-after=15s 600 \
              opencode run \
                --model omniroute/build-combo \
                --format json \
                "$(cat /tmp/build-prompt.txt)" \
              | tee "/tmp/opencode-build-attempt-${ATTEMPT}.jsonl"

            EXIT_CODE=${PIPESTATUS[0]}

            set -e

            if [ "$EXIT_CODE" -eq 0 ]; then
              cp "/tmp/opencode-build-attempt-${ATTEMPT}.jsonl" /tmp/opencode-build.jsonl
              echo "BUILD concluído no attempt $ATTEMPT"
              exit 0
            fi

            if [ "$EXIT_CODE" -ne 124 ]; then
              echo "::error::OpenCode falhou com exit code $EXIT_CODE"
              exit "$EXIT_CODE"
            fi

            echo "::warning::OpenCode timeout no attempt $ATTEMPT"

            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::OpenCode excedeu 600s em $MAX_ATTEMPTS tentativas"
              exit 124
            fi

            sleep $((ATTEMPT * 15))
          done

      - name: Validate changed files
        run: |
          echo "Changed tracked files:"
          git diff --name-only

          echo "Untracked files:"
          git ls-files --others --exclude-standard

          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/changed-files.txt

          if [ ! -s /tmp/changed-files.txt ]; then
            echo "ERROR: OpenCode produced no file changes."
            exit 1
          fi

          INVALID_FILES="$(
            grep -Ev '^(src/|test/)' /tmp/changed-files.txt || true
          )"

          if [ -n "$INVALID_FILES" ]; then
            echo "ERROR: OpenCode modified forbidden files:"
            echo "$INVALID_FILES"
            exit 1
          fi

      - name: Run tests
        run: |
          npm test

      - name: Validate diff
        run: |
          git diff --check
          git diff

      - name: Create branch and commit
        env:
          BRANCH_NAME: agent-v3/issue-${{ github.event.issue.number }}-${{ github.run_id }}
        run: |
          git config user.name "dev-agent-bot"
          git config user.email "dev-agent-bot@users.noreply.github.com"

          git switch -c "$BRANCH_NAME"

          git add --all -- src test
          git commit -m "feat: implement issue #${ISSUE_NUMBER}"

          git push origin "$BRANCH_NAME"

          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: Prepare PR body
        run: |
          {
            echo "Automated BUILD for #${ISSUE_NUMBER}."
            echo
            echo "Source issue: #${ISSUE_NUMBER}"
            echo
            echo 'Validation:'
            echo '- OpenCode BUILD completed'
            echo '- allowed-files validation passed'
            echo '- npm test passed'
            echo '- git diff --check passed'
            echo
            echo 'Merge remains manual.'
          } > /tmp/pr-body.md

      - name: Create pull request
        run: |
          PR_URL="$(
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH_NAME" \
              --title "[agent-v3] ${ISSUE_TITLE}" \
              --body-file /tmp/pr-body.md
          )"

          echo "Created PR: $PR_URL"
          echo "### BUILD result" >> "$GITHUB_STEP_SUMMARY"
          echo "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
