name: Dev Agent BUILD POC

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: dev-agent-build-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.label.name == 'agent-build-v3'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      GH_TOKEN: ${{ github.token }}

      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}

      OPENCODE_CONFIG_CONTENT: >-
        {
          "$schema": "https://opencode.ai/config.json",
          "autoupdate": false,
          "provider": {
            "omniroute": {
              "npm": "@ai-sdk/openai-compatible",
              "name": "OmniRoute",
              "options": {
                "baseURL": "https://omniroute-cvr6.srv1921690.hstgr.cloud/v1",
                "apiKey": "{env:OMNIROUTE_API_KEY}"
              },
              "models": {
                "build-combo": {
                  "name": "Build Combo"
                }
              }
            }
          },
          "permission": {
            "*": "deny",
            "read": "allow",
            "glob": "allow",
            "grep": "allow",
            "edit": {
              "*": "deny",
              "src/**": "allow",
              "test/**": "allow"
            }
          }
        }

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install OpenCode
        run: |
          npm install --global opencode-ai@1.18.23
          opencode --version

      - name: Prepare BUILD prompt
        run: |
          python3 <<'PY'
          import os

          prompt = f"""# BUILD

Implement the GitHub Issue below.

## Issue

Number: #{os.environ["ISSUE_NUMBER"]}
Title: {os.environ["ISSUE_TITLE"]}

{os.environ["ISSUE_BODY"]}

## Rules

- Inspect only files necessary for this task.
- Make the minimum implementation required.
- Modify only files under src/** and test/**.
- Do not modify workflows, configuration, documentation, or unrelated files.
- Do not run shell commands.
- Do not use git.
- Do not create branches.
- Do not commit.
- Do not push.
- Do not create a pull request.
- Git operations and validation are handled externally after you finish.
"""
          with open("/tmp/build-prompt.txt", "w") as f:
              f.write(prompt)
          PY

      - name: Run BUILD agent
        run: |
          timeout 300 \
            opencode run \
              --model omniroute/build-combo \
              --format json \
              "$(cat /tmp/build-prompt.txt)" \
            | tee opencode-build.jsonl

      - name: Validate changed files
        run: |
          echo "Changed tracked files:"
          git diff --name-only

          echo "Untracked files:"
          git ls-files --others --exclude-standard

          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/changed-files.txt

          if [ ! -s /tmp/changed-files.txt ]; then
            echo "ERROR: OpenCode produced no file changes."
            exit 1
          fi

          INVALID_FILES="$(
            grep -Ev '^(src/|test/)' /tmp/changed-files.txt || true
          )"

          if [ -n "$INVALID_FILES" ]; then
            echo "ERROR: OpenCode modified forbidden files:"
            echo "$INVALID_FILES"
            exit 1
          fi

      - name: Run tests
        run: |
          npm test

      - name: Validate diff
        run: |
          git diff --check
          git diff

      - name: Create branch and commit
        env:
          BRANCH_NAME: agent-v3/issue-${{ github.event.issue.number }}-${{ github.run_id }}
        run: |
          git config user.name "dev-agent-bot"
          git config user.email "dev-agent-bot@users.noreply.github.com"

          git switch -c "$BRANCH_NAME"

          git add --all -- src test
          git commit -m "feat: implement issue #${ISSUE_NUMBER}"

          git push origin "$BRANCH_NAME"

          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: Prepare PR body
        run: |
          python3 <<'PY'
          import os

          body = f"""Automated BUILD for #{os.environ["ISSUE_NUMBER"]}.

          Source issue: #{os.environ["ISSUE_NUMBER"]}

          Validation:
          - OpenCode BUILD completed
          - allowed-files validation passed
          - npm test passed
          - git diff --check passed

          Merge remains manual.
          """

          with open("/tmp/pr-body.md", "w") as f:
              f.write(body)
          PY

      - name: Create pull request
        run: |
          PR_URL="$(
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH_NAME" \
              --title "[agent-v3] ${ISSUE_TITLE}" \
              --body-file /tmp/pr-body.md
          )"

          echo "Created PR: $PR_URL"
          echo "### BUILD result" >> "$GITHUB_STEP_SUMMARY"
          echo "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
